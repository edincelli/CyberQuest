<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page unavailable | CyberQuest</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #131b26; color: #edf3fa; }
    main { width: 100%; max-width: 560px; padding: clamp(24px, 6vw, 48px);
      border: 1px solid #405167; border-radius: 12px; background: #1b2736; }
    .brand { color: #85def0; font-weight: 600; letter-spacing: .08em; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.2; }
    p { line-height: 1.65; }
    .hint { color: #c0cfdf; }
  </style>
</head>
<body>
  <main>
    <p class="brand">CYBERQUEST</p>
    <h1>Page unavailable</h1>
    <p>This page is not available in the training environment.</p>
    <p class="hint">Check the address, or use the browser's Back or Home control
      to continue your activity.</p>
  </main>
</body>
</html>
